[project]
name = "flaky-agent"
version = "0.1.0"
description = "LLM agent that diagnoses flaky failures in GitHub Actions jobs (Projet d'expertise PE_5A_11, ENSAM Meknès)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alae Rhazouani" },
    { name = "Ismail Allouch" },
    { name = "Omar Bouhlal" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaky_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
